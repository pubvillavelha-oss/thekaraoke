<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karaokê - Fila de Cantores</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 780px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 30px 0 20px;
        }
        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #aaa; margin-top: 6px; font-size: 0.95rem; }

        .header-actions { margin-top: 14px; }
        .btn-presentation {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(90deg, #6ba3ff, #8f6bff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        .btn-presentation:hover { transform: scale(1.02); }
        .btn-presentation:active { transform: scale(0.97); }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .form-grid .full-width { grid-column: 1 / -1; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 0.95rem;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #f7971e;
            box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.2);
        }
        input::placeholder { color: #777; }

        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
            width: 100%;
            margin-top: 6px;
        }
        .btn-success {
            background: rgba(70, 200, 70, 0.15);
            color: #6bff6b;
            border: 1px solid rgba(70, 200, 70, 0.25);
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-danger {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 70, 70, 0.25);
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-link {
            background: rgba(70, 130, 255, 0.15);
            color: #6ba3ff;
            border: 1px solid rgba(70, 130, 255, 0.25);
            padding: 6px 14px;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .queue-header h2 { font-size: 1.2rem; }
        .queue-count {
            background: rgba(247, 151, 30, 0.2);
            color: #ffd200;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .daily-limit {
            background: rgba(70, 130, 255, 0.15);
            color: #6ba3ff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .empty-msg {
            text-align: center;
            color: #666;
            padding: 40px 0;
            font-style: italic;
        }

        .singer-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.2s;
        }
        .singer-item:hover { background: rgba(255, 255, 255, 0.07); }
        .singer-item.done {
            opacity: 0.5;
            order: 999;
        }
        .singer-item.done .singer-name {
            text-decoration: line-through;
        }

        .singer-pos {
            font-size: 1.3rem;
            font-weight: 800;
            color: #f7971e;
            min-width: 32px;
            text-align: center;
        }

        .singer-info { flex: 1; min-width: 0; }
        .singer-name { font-weight: 600; font-size: 1rem; }
        .singer-phone { font-size: 0.8rem; color: #999; margin-top: 2px; }
        .singer-song { font-size: 0.85rem; color: #bbb; margin-top: 2px; }
        .singer-artist { font-size: 0.8rem; color: #888; margin-top: 1px; font-style: italic; }

        .singer-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }

        footer {
            text-align: center;
            padding: 30px 0 10px;
            color: #555;
            font-size: 0.8rem;
        }
        footer a { color: #777; text-decoration: none; }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            font-size: 0.8rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .full-width { grid-column: 1; }
            header h1 { font-size: 1.6rem; }
            .singer-item { flex-wrap: wrap; }
            .singer-actions { width: 100%; justify-content: flex-end; }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.4s, bottom 0.4s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; bottom: 50px; }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>🎤 Fila do Karaokê</h1>
        <p>Adicione seu nome e música para entrar na fila</p>
        <div class="header-actions">
            <a href="apresentacao.html" target="_blank" rel="noopener" class="btn-presentation">📺 Abrir tela de apresentação</a>
            <a href="inclusao.html" target="_blank" rel="noopener" class="btn-presentation" style="background:linear-gradient(90deg,#f7971e,#ffd200);color:#1a1a2e;margin-left:8px;">➕ Abrir tela de inclusão</a>
        </div>
        <div class="status-bar">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </header>

    <!-- FORM -->
    <div class="card">
        <form id="formAdd">
            <div class="form-grid">
                <div>
                    <label for="nome">Nome da Pessoa *</label>
                    <input type="text" id="nome" placeholder="Ex: Ana" required />
                </div>
                <div>
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(11) 99999-8888" />
                </div>
                <div class="full-width">
                    <label for="musica">Nome da Música *</label>
                    <input type="text" id="musica" placeholder="Ex: Bohemian Rhapsody" required />
                </div>
                <div class="full-width">
                    <label for="artista">Artista / Banda *</label>
                    <input type="text" id="artista" placeholder="Ex: Queen" required />
                </div>
                <div class="full-width">
                    <label for="link">Link da Música (YouTube / Spotify)</label>
                    <input type="url" id="link" placeholder="https://youtu.be/..." />
                </div>
            </div>
            <button type="submit" class="btn btn-primary">➕ Adicionar à fila</button>
        </form>
    </div>

    <!-- QUEUE -->
    <div class="card">
        <div class="queue-header">
            <h2>📋 Fila de Cantores</h2>
            <div>
                <span class="daily-limit" id="dailyLimit">📅 0 / 60 hoje</span>
                <span class="queue-count" id="queueCount">0 na fila</span>
            </div>
        </div>
        <div id="queueList">
            <div class="empty-msg">Carregando fila...</div>
        </div>
    </div>

    <footer>
        Feito com ❤️ para o karaokê &mdash; Dados sincronizados em tempo real
    </footer>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============================================================
    // 🔥 CONFIGURAÇÃO DO FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBDl_Jgh00rA6kozOjCXjgQCwhPjVfc4_E",
        authDomain: "karaokevvp.firebaseapp.com",
        projectId: "karaokevvp",
        storageBucket: "karaokevvp.firebasestorage.app",
        messagingSenderId: "938258818805",
        appId: "1:938258818805:web:bbdae00b3cf3811f1b07bc"
    };

    // ===== INICIALIZA FIREBASE =====
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = 'karaoke_fila';
    const DAILY_LIMIT = 60;

    // ===== DOM =====
    const form          = document.getElementById('formAdd');
    const inputNome     = document.getElementById('nome');
    const inputTelefone = document.getElementById('telefone');
    const inputMusica   = document.getElementById('musica');
    const inputArtista  = document.getElementById('artista');
    const inputLink     = document.getElementById('link');
    const queueList     = document.getElementById('queueList');
    const queueCount    = document.getElementById('queueCount');
    const dailyLimitEl  = document.getElementById('dailyLimit');
    const statusDot     = document.getElementById('statusDot');
    const statusText    = document.getElementById('statusText');

    let toastTimer = null;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function setStatus(online) {
        statusDot.className = 'status-dot ' + (online ? 'online' : 'offline');
        statusText.textContent = online ? 'Online — dados em tempo real' : 'Offline — sem conexão';
    }

    // ===== ESCAPE =====
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ===== LIMITE DIÁRIO =====
    function getTodayStr() {
        return new Date().toISOString().slice(0, 10);
    }

    async function getDailyCount() {
        try {
            const snapshot = await db.collection(COLLECTION)
                .where('dataCadastro', '==', getTodayStr())
                .get();
            return snapshot.size;
        } catch {
            return 0;
        }
    }

    // ===== VERIFICA SE PESSOA PODE CADASTRAR =====
    async function pessoaPodeCadastrar(nome) {
        const nomeLower = nome.trim().toLowerCase();
        try {
            const snapshot = await db.collection(COLLECTION)
                .where('nomeLower', '==', nomeLower)
                .where('done', '==', false)
                .get();
            return snapshot.empty;
        } catch {
            return true;
        }
    }

    // ===== RENDER =====
    function render(singers) {
        const pending = singers.filter(s => !s.done);
        const done    = singers.filter(s => s.done);

        if (singers.length === 0) {
            queueList.innerHTML = `<div class="empty-msg">Ninguém na fila ainda. Seja o primeiro! 🎤</div>`;
            queueCount.textContent = '0 na fila';
            dailyLimitEl.textContent = `📅 0 / ${DAILY_LIMIT} hoje`;
            return;
        }

        const sorted = [...pending, ...done];

        queueList.innerHTML = sorted.map((s, idx) => {
            const pos = idx + 1;
            const isDone = s.done;
            const phoneDisplay = s.telefone ? `📞 ${s.telefone}` : '';

            return `
                <div class="singer-item ${isDone ? 'done' : ''}" data-id="${s.id}">
                    <div class="singer-pos">${isDone ? '✅' : `#${pos}`}</div>
                    <div class="singer-info">
                        <div class="singer-name">${escapeHtml(s.nome)}</div>
                        <div class="singer-artist">🎤 ${escapeHtml(s.artista)}</div>
                        <div class="singer-song">🎵 ${escapeHtml(s.musica)}</div>
                        ${phoneDisplay ? `<div class="singer-phone">${phoneDisplay}</div>` : ''}
                    </div>
                    <div class="singer-actions">
                        ${s.link ? `<a href="${escapeHtml(s.link)}" target="_blank" rel="noopener" class="btn btn-link">🔗 Ouvir</a>` : ''}
                        ${!isDone ? `<button class="btn btn-success btn-sm" onclick="markDone('${s.id}')">✔ Já cantou</button>` : ''}
                        <button class="btn btn-danger btn-sm" onclick="removeSinger('${s.id}')">✕ Remover</button>
                    </div>
                </div>
            `;
        }).join('');

        const pendCount = pending.length;
        queueCount.textContent = `${pendCount} na fila`;

        getDailyCount().then(count => {
            dailyLimitEl.textContent = `📅 ${count} / ${DAILY_LIMIT} hoje`;
        });
    }

    // ===== ESCUTA MUDANÇAS EM TEMPO REAL =====
    function listenQueue() {
        db.collection(COLLECTION)
            .orderBy('createdAt', 'asc')
            .onSnapshot((snapshot) => {
                const singers = [];
                snapshot.forEach((doc) => {
                    singers.push({ id: doc.id, ...doc.data() });
                });
                render(singers);
                setStatus(true);
            }, (error) => {
                console.error('Erro no Firestore:', error);
                setStatus(false);
            });
    }

    // ===== ADICIONAR =====
    async function addSinger(nome, telefone, musica, artista, link) {
        const dailyCount = await getDailyCount();
        if (dailyCount >= DAILY_LIMIT) {
            showToast('⚠️ Limite de 60 músicas por dia atingido! Volte amanhã.');
            return false;
        }

        const pode = await pessoaPodeCadastrar(nome);
        if (!pode) {
            showToast(`⚠️ ${nome.trim()} já está na fila. Aguarde cantar para cadastrar novamente.`);
            return false;
        }

        try {
            await db.collection(COLLECTION).add({
                nome: nome.trim(),
                nomeLower: nome.trim().toLowerCase(),
                telefone: telefone.trim(),
                musica: musica.trim(),
                artista: artista.trim(),
                link: link.trim(),
                done: false,
                dataCadastro: getTodayStr(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast(`🎤 ${nome.trim()} entrou na fila!`);
            return true;
        } catch (error) {
            console.error('Erro ao adicionar:', error);
            showToast('⚠️ Erro ao adicionar. Tente novamente.');
            return false;
        }
    }

    // ===== MARCAR COMO JÁ CANTOU =====
    async function markDone(id) {
        try {
            await db.collection(COLLECTION).doc(id).update({
                done: true
            });
            showToast('✅ Cantor(a) marcado(a) como já cantou!');
        } catch (error) {
            console.error('Erro ao marcar:', error);
            showToast('⚠️ Erro ao atualizar. Tente novamente.');
        }
    }

    // ===== REMOVER =====
    async function removeSinger(id) {
        if (!confirm('Tem certeza que deseja remover este cantor da fila?')) return;

        try {
            await db.collection(COLLECTION).doc(id).delete();
            showToast('✕ Cantor(a) removido(a) da fila');
        } catch (error) {
            console.error('Erro ao remover:', error);
            showToast('⚠️ Erro ao remover. Tente novamente.');
        }
    }

    // ===== FORM SUBMIT =====
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome     = inputNome.value.trim();
        const telefone = inputTelefone.value.trim();
        const musica   = inputMusica.value.trim();
        const artista  = inputArtista.value.trim();
        const link     = inputLink.value.trim();

        if (!nome || !musica || !artista) {
            showToast('⚠️ Preencha nome, música e artista.');
            return;
        }

        const btn = form.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = '⏳ Salvando...';

        const added = await addSinger(nome, telefone, musica, artista, link);

        btn.disabled = false;
        btn.textContent = '➕ Adicionar à fila';

        if (added) {
            form.reset();
            inputNome.focus();
        }
    });

    // ===== INICIA =====
    listenQueue();
</script>

</body>
</html>
