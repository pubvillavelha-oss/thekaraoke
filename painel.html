<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duas Seções: Web + Vídeo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Barra de controles no topo */
    .toolbar {
      background: #1e1e2e;
      color: #fff;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .toolbar label {
      font-size: 14px;
      margin-right: 5px;
    }

    .toolbar input[type="file"] {
      color: #fff;
      font-size: 14px;
    }

    /* Layout em duas colunas */
    .container {
      display: flex;
      height: calc(100vh - 60px); /* desconta a barra de controles */
    }

    .web-section {
      flex: 1;
      border-right: 2px solid #333;
    }

    .web-section iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .video-section video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Barra de controles -->
  <div class="toolbar">
    <!-- ===== CAMPO DE PÁGINA COMENTADO =====
    <label>Endereço da página:</label>
    <input type="text" id="urlInput" placeholder="https://exemplo.com/sua-pagina">
    <button onclick="carregarPagina()">Carregar página</button>
    ========================================== -->

    <label>Vídeo MP4:</label>
    <input type="file" id="videoInput" accept="video/mp4">
  </div>

  <div class="container">
    <!-- Seção 1: Página fixa com atualização automática -->
    <div class="web-section">
      <iframe
        id="liveFrame"
        src="https://pubvillavelha-oss.github.io/thekaraoke/apresentacao.html"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Seção 2: Vídeo MP4 -->
    <div class="video-section">
      <video id="meuVideo" controls autoplay muted loop>
        Seu navegador não suporta vídeo HTML5.
      </video>
    </div>
  </div>

  <script>
    // ===== FUNÇÃO DE CARREGAR PÁGINA COMENTADA (não é mais necessária) =====
    /*
    function carregarPagina() {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        document.getElementById('liveFrame').src = url;
      } else {
        alert('Digite o endereço da página.');
      }
    }
    */

    // ===== Campo de vídeo: lê o arquivo MP4 selecionado =====
    document.getElementById('videoInput').addEventListener('change', function(event) {
      const arquivo = event.target.files[0];
      if (arquivo) {
        const urlVideo = URL.createObjectURL(arquivo);
        const video = document.getElementById('meuVideo');
        video.src = urlVideo;
        video.play();
      }
    });

    // ===== Atualização automática da página (recarrega a cada 30s) =====
    const iframe = document.getElementById('liveFrame');
    const intervalo = 30000; // 30 segundos (ajuste como quiser)

    setInterval(() => {
      if (iframe.src) {
        iframe.src = iframe.src;
      }
    }, intervalo);
  </script>

</body>
</html>
