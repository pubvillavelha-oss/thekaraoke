<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Login</title>
    <!-- Firebase SDKs — ORDEM CORRETA: app primeiro -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 340px;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #ccc; margin-bottom: 4px; text-align: left; }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            text-align: left;
        }
        input:focus { outline: none; border-color: #f7971e; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .erro { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; }
        .loading { color: #aaa; font-size: 0.9rem; margin-top: 12px; }
        .sem-acesso { margin-top: 16px; }
        .sem-acesso .icone { font-size: 3rem; }
        .sem-acesso p { color: #ff6b6b; font-size: 0.9rem; margin-top: 8px; line-height: 1.4; }
        .sem-acesso button { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Acesso Restrito</h1>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" required />
            <label for="senha">Senha</label>
            <input type="password" id="senha" required />
            <button type="submit" id="btnLogin">Entrar</button>
        </form>

        <p class="erro" id="erro"></p>
        <p class="loading" id="loading" style="display:none;">Verificando acesso...</p>

        <!-- AVISO: USUÁRIO SEM PERMISSÃO (para o loop aqui) -->
        <div class="sem-acesso" id="semAcesso" style="display:none;">
            <div class="icone">🚫</div>
            <p>Seu usuário não tem acesso a nenhuma página.<br/>Procure o administrador.</p>
            <button type="button" id="btnVoltar">Voltar ao login</button>
        </div>
    </div>

    <script>
        // 🔥 CONFIGURAÇÃO DO FIREBASE (mesma dos outros arquivos)
        const firebaseConfig = {
            apiKey: "AIzaSyBDl_Jgh00rA6kozOjCXjgQCwhPjVfc4_E",
            authDomain: "karaokevvp.firebaseapp.com",
            projectId: "karaokevvp",
            storageBucket: "karaokevvp.firebasestorage.app",
            messagingSenderId: "938258818805",
            appId: "1:938258818805:web:bbdae00b3cf3811f1b07bc"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const semAcesso = document.getElementById('semAcesso');
        const loginForm = document.getElementById('loginForm');
        const loading = document.getElementById('loading');
        const erro = document.getElementById('erro');

        // ===== REDIRECIONA SÓ PARA PÁGINAS QUE O USUÁRIO TEM PERMISSÃO =====
        async function redirecionarParaPagina(user) {
            loading.style.display = 'block';
            try {
                const doc = await db.collection('permissoes').doc(user.uid).get();
                const paginas = doc.exists && Array.isArray(doc.data().paginas)
                    ? doc.data().paginas
                    : [];
                if (paginas.length > 0) {
                    window.location.href = paginas[0]; // primeira página permitida
                    return;
                }
                // Sem permissão → mostra aviso e NÃO redireciona (quebra o loop)
                loading.style.display = 'none';
                loginForm.style.display = 'none';
                semAcesso.style.display = 'block';
            } catch (err) {
                console.error('Erro ao ler permissões:', err);
                loading.style.display = 'none';
                loginForm.style.display = 'none';
                semAcesso.style.display = 'block';
            }
        }

        // Se já estiver logado, tenta acessar a página permitida
        auth.onAuthStateChanged(user => {
            if (user) {
                redirecionarParaPagina(user);
            } else {
                loading.style.display = 'none';
                semAcesso.style.display = 'none';
                loginForm.style.display = 'block';
            }
        });

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            erro.textContent = '';
            loading.style.display = 'block';
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('email').value,
                    document.getElementById('senha').value
                );
                // onAuthStateChanged cuida do redirecionamento
            } catch (err) {
                erro.textContent = 'E-mail ou senha inválidos.';
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Botão "Voltar ao login" (faz logout e mostra o formulário)
        document.getElementById('btnVoltar').addEventListener('click', () => {
            auth.signOut();
        });
    </script>
</body>
</html>
